openapi: 3.0.3

info:
  title: ssm-emp-mis API
  version: 1.0.1
  description: |
    EMP 员工管理 MIS 系统后端接口。

    **返回约定**
    - 业务失败返回 HTTP 200，具体结果看响应体 `code`（500）。
    - 未登录返回 HTTP 401；方法不支持返回 405；路径变量类型错误返回 400。
    - 除 `/login` 与 `/health` 外，全部接口要求已登录（`JSESSIONID` Cookie）。

    **本地启动**
    ```bash
    docker exec -i dev-mysql mysql --default-character-set=utf8mb4 -uroot -p123456 < sql/init.sql
    mvn -B clean package
    cp target/ssm-emp-mis.war "$CATALINA_HOME/webapps/ROOT.war"
    ```
    演示账号：`admin` / `123456`。

servers:
  - url: http://localhost:8080
    description: 本地 Tomcat，上下文路径设为 `/`

tags:
  - name: 健康检查
    description: 部署后验证框架与持久层是否装配成功
  - name: 认证
    description: 基于 session 的登录与退出
  - name: 员工管理
    description: 员工资源的增删改查、多条件分页与批量删除
  - name: 部门管理
    description: 部门资源的增删改查；与员工靠部门名称关联，删除前校验、改名级联
  - name: 考勤管理
    description: 考勤登记与月度汇总；状态由打卡时间推导，为薪资扣款提供依据
  - name: 薪资管理
    description: 按月生成、按考勤重算、调整与发放；已发放记录锁定
  - name: 账号管理
    description: 登录账号的增删改查与口令重置；口令以摘要存储且不随响应返回
  - name: 操作审计
    description: 写操作自动落库，只读查询；无任何写入接口

security:
  - cookieAuth: []

paths:
  /health:
    get:
      tags: [健康检查]
      summary: 框架存活检查
      description: 只经过 SpringMVC 分发与 JSON 序列化，不访问数据库。
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data: { type: string, example: UP }

  /health/db:
    get:
      tags: [健康检查]
      summary: 持久层检查
      description: 调用 `EmpMapper.selectCount`，返回 `emp` 表行数。数据源、Mapper 注入、分页插件任一异常都会在此暴露。
      security: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data: { type: integer, format: int64, example: 12 }

  /login:
    post:
      tags: [认证]
      summary: 登录
      description: 校验通过后将登录态写入 session，并通过 `Set-Cookie` 下发 `JSESSIONID`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
      responses:
        '200':
          description: |
            成功时 `code=200` 且返回用户信息；失败时 `code=500`，
            message 为「用户名或密码错误」或校验提示。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultLoginUser'
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 登录成功后下发 JSESSIONID

  /logout:
    post:
      tags: [认证]
      summary: 退出登录
      description: 调用 `session.invalidate()` 销毁会话，之后访问受保护接口返回 401。
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /emps:
    get:
      tags: [员工管理]
      summary: 列表 + 多条件模糊 + 分页
      description: |
        条件之间为 AND 关系；空白字符串视为未传。
        排序固定为 `emp_id` 倒序，保证分页结果稳定。
      parameters:
        - name: name
          in: query
          description: 姓名，前后模糊匹配
          schema: { type: string, example: 张 }
        - name: gender
          in: query
          description: 性别，精确匹配
          schema: { type: string, enum: [男, 女] }
        - name: dept
          in: query
          description: 部门，精确匹配
          schema: { type: string, example: 研发部 }
        - name: page
          in: query
          description: 页码，从 1 开始；小于 1 时回落为 1
          schema: { type: integer, default: 1, minimum: 1 }
        - name: size
          in: query
          description: 每页条数；小于 1 时回落为 5，上限 100
          schema: { type: integer, default: 5, minimum: 1, maximum: 100 }
        - name: sortBy
          in: query
          description: |
            排序字段，白名单：empId / empName / salary / hireDate。
            越界值回落为 empId —— 排序列无法用占位符，只能拼接，故用白名单而非透传。
          schema:
            type: string
            default: empId
            enum: [empId, empName, salary, hireDate]
        - name: sortDir
          in: query
          description: 排序方向；只有 asc 表示升序，缺省或非法值一律降序
          schema:
            type: string
            default: desc
            enum: [asc, desc]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPageEmp'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [员工管理]
      summary: 新增员工
      description: 服务端生成 empId、createTime、updateTime、deleted，请求中传入会被忽略。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpInput'
      responses:
        '200':
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [员工管理]
      summary: 修改员工
      description: |
        修改薪资时会同步写入一条薪资标准（生效日为当月 1 日，同月重复调薪覆盖），
        之后补生成历史月份仍按当时的标准计算。dept 必须已存在且处于启用状态。信息
      description: 必须携带 `empId`；仅更新非 null 字段。ID 不存在或已逻辑删除时返回「员工不存在或已删除」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpInput'
      responses:
        '200':
          description: 修改成功，或业务失败（`code=500`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [员工管理]
      summary: 批量删除
      description: ID 列表放在**请求体**中，不是查询参数。返回实际受影响行数。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: integer }
              example: [14, 15]
      responses:
        '200':
          description: 删除成功，`data` 为受影响行数；空数组返回「批量删除的 ID 列表不能为空」
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data: { type: integer, example: 2 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /emps/{id}:
    get:
      tags: [员工管理]
      summary: 单条查询
      parameters:
        - $ref: '#/components/parameters/EmpId'
      responses:
        '200':
          description: 查询成功；不存在时 `code=500`、message 为「员工不存在：{id}」
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEmp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [员工管理]
      summary: 删除单条（逻辑删除）
      description: |
        实际执行 `UPDATE emp SET deleted = 1`。
        接口层面查不到该记录，但数据库中物理行仍在；重复删除返回「员工不存在或已删除」。
      parameters:
        - $ref: '#/components/parameters/EmpId'
      responses:
        '200':
          description: 删除成功，或业务失败（`code=500`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /depts:
    get:
      tags: [部门管理]
      summary: 部门列表
      description: 不分页——部门是低频变更的基础数据，量级在两位数。
      parameters:
        - name: name
          in: query
          description: 部门名称，前后模糊
          schema: { type: string, example: 研 }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Dept'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [部门管理]
      summary: 新增部门
      description: 名称唯一；不与员工表联动。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeptInput'
      responses:
        '200':
          description: 成功，或业务失败（名称重复 / 校验不通过）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [部门管理]
      summary: 修改部门
      description: |
        必须带 deptId。**名称变更时会在同一事务内把 emp.dept 的旧名刷成新名**，
        否则员工将指向一个不存在的部门——这是「用名称做关联」必须付的代价。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeptInput'
      responses:
        '200':
          description: 成功，或业务失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /depts/{id}:
    get:
      tags: [部门管理]
      summary: 部门单条查询
      parameters:
        - $ref: '#/components/parameters/DeptId'
      responses:
        '200':
          description: 查询成功；不存在时 code=500
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Dept'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [部门管理]
      summary: 删除部门
      description: 部门下仍有员工时拒绝删除，避免员工指向不存在的部门。
      parameters:
        - $ref: '#/components/parameters/DeptId'
      responses:
        '200':
          description: 成功，或业务失败（该部门下仍有 N 名员工，无法删除）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /depts/{id}/employees:
    get:
      tags: [部门管理]
      summary: 该部门下的员工
      description: 路径中的 id 是**部门 ID**；按部门名称匹配 emp.dept，按 emp_id 升序。
      parameters:
        - $ref: '#/components/parameters/DeptId'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Emp'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /attendance:
    get:
      tags: [考勤管理]
      summary: 分页查询考勤
      parameters:
        - name: empId
          in: query
          schema: { type: integer }
        - name: month
          in: query
          description: YYYY-MM，按 work_date 落在该月过滤
          schema: { type: string, example: '2026-11' }
        - $ref: '#/components/parameters/PageNo'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          records:
                            type: array
                            items: { $ref: '#/components/schemas/Attendance' }
                          total: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [考勤管理]
      summary: 登记考勤
      description: |
        status 由服务端按打卡时间推导（9:00 后到岗=迟到、18:00 前离岗=早退、
        不填时间=缺勤），客户端传入会被忽略。上下班时间必须同时填或同时留空。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceInput' }
      responses:
        '200':
          description: 成功，或业务失败（员工不存在 / 时间不自洽 / 同人同日重复）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [考勤管理]
      summary: 修改考勤
      description: 必须带 attId；改动时间后状态会重新推导。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AttendanceInput'
                - type: object
                  required: [attId]
                  properties:
                    attId: { type: integer }
      responses:
        '200':
          description: 成功，或业务失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /attendance/summary:
    get:
      tags: [考勤管理]
      summary: 月度考勤汇总
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, example: '2026-11' }
      responses:
        '200':
          description: 按人聚合的出勤统计
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AttendanceSummary' }
        '400':
          description: 缺少 month
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /attendance/{id}:
    get:
      tags: [考勤管理]
      summary: 考勤单条查询
      parameters:
        - $ref: '#/components/parameters/AttendanceId'
      responses:
        '200':
          description: 查询成功；不存在时 code=500
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Attendance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [考勤管理]
      summary: 删除考勤
      description: 物理删除；若已参与薪资计算，需调用薪资重算同步。
      parameters:
        - $ref: '#/components/parameters/AttendanceId'
      responses:
        '200':
          description: 成功，或业务失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /salaries:
    get:
      tags: [薪资管理]
      summary: 分页查询薪资
      parameters:
        - name: empId
          in: query
          schema: { type: integer }
        - name: month
          in: query
          schema: { type: string, example: '2026-11' }
        - $ref: '#/components/parameters/PageNo'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          records:
                            type: array
                            items: { $ref: '#/components/schemas/SalaryRecord' }
                          total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [薪资管理]
      summary: 调整奖金与扣款
      description: |
        empId 与 month 仅作校验占位，改了不生效；实发由服务端重算。
        已发放记录拒绝修改。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalaryUpdate' }
      responses:
        '200':
          description: 成功，或业务失败（已发放 / 扣款超限）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /salaries/generate:
    post:
      tags: [薪资管理]
      summary: 按月批量生成
      description: |
        对在职员工逐个生成：base 取自「薪资标准」中生效日不晚于该月末的最后一条
        （查不到才回退 emp.salary），扣款按当月考勤计算。
        已存在的员工跳过，不覆盖已有记录。
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, example: '2026-11' }
      responses:
        '200':
          description: 生成结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalaryGenerateResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /salaries/recalculate:
    post:
      tags: [薪资管理]
      summary: 按当前考勤重算
      description: |
        只处理待发放记录，已发放跳过。会覆盖手工调整过的扣款——
        语义就是「以考勤为准」。该月无记录时返回业务失败。
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, example: '2026-11' }
      responses:
        '200':
          description: 重算结果，generated 表示重算条数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalaryGenerateResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /salaries/{id}:
    get:
      tags: [薪资管理]
      summary: 薪资单条查询
      parameters:
        - $ref: '#/components/parameters/SalaryId'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalaryRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [薪资管理]
      summary: 删除待发放记录
      parameters:
        - $ref: '#/components/parameters/SalaryId'
      responses:
        '200':
          description: 成功；已发放返回业务失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /salaries/{id}/pay:
    put:
      tags: [薪资管理]
      summary: 标记已发放
      description: 状态单向流转，没有撤销发放的接口。
      parameters:
        - $ref: '#/components/parameters/SalaryId'
      responses:
        '200':
          description: 成功；重复发放返回业务失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [账号管理]
      summary: 分页查询账号
      parameters:
        - name: keyword
          in: query
          description: 用户名或显示名模糊
          schema: { type: string }
        - name: status
          in: query
          schema: { type: integer, enum: [0, 1] }
        - $ref: '#/components/parameters/PageNo'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 查询成功；响应不含 passwordHash
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          records:
                            type: array
                            items: { $ref: '#/components/schemas/User' }
                          total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [账号管理]
      summary: 新增账号
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '200':
          description: 成功；用户名重复返回业务失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [账号管理]
      summary: 修改显示名与状态
      description: 用户名不可改；不能停用当前登录账号。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: 成功，或业务失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/{id}:
    get:
      tags: [账号管理]
      summary: 账号单条查询
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [账号管理]
      summary: 删除账号
      description: 不能删当前登录账号，也不能删掉最后一个启用账号。
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 成功，或业务失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/{id}/password:
    put:
      tags: [账号管理]
      summary: 重置口令
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordReset' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /op-logs:
    get:
      tags: [操作审计]
      summary: 查询审计记录
      description: 只读。写操作由切面自动落库，没有任何写入接口。
      parameters:
        - name: operator
          in: query
          description: 操作人登录名，模糊匹配
          schema: { type: string }
        - $ref: '#/components/parameters/PageNo'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          records:
                            type: array
                            items: { $ref: '#/components/schemas/OpLog' }
                          total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID

  parameters:
    EmpId:
      name: id
      in: path
      required: true
      description: 员工 ID，正整数
      schema: { type: integer, example: 1 }
    DeptId:
      name: id
      in: path
      required: true
      description: 部门 ID，正整数
      schema: { type: integer, example: 1 }
    AttendanceId:
      name: id
      in: path
      required: true
      description: 考勤记录 ID
      schema: { type: integer, example: 1 }
    SalaryId:
      name: id
      in: path
      required: true
      description: 薪资记录 ID
      schema: { type: integer, example: 1 }
    UserId:
      name: id
      in: path
      required: true
      description: 账号 ID
      schema: { type: integer, example: 1 }
    PageNo:
      name: page
      in: query
      description: 页码，小于 1 时回落为 1
      schema: { type: integer, default: 1, minimum: 1 }
    PageSize:
      name: size
      in: query
      description: 每页条数，上限 100
      schema: { type: integer, default: 10, minimum: 1, maximum: 100 }

  responses:
    Unauthorized:
      description: 未登录或登录已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
          example:
            code: 401
            message: 未登录或登录已失效
            data: null
    BadRequest:
      description: 参数格式不正确（如 ID 传了非数字）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
          example:
            code: 400
            message: 参数格式不正确：id
            data: null

  schemas:
    Result:
      type: object
      description: 统一返回结构
      properties:
        code:
          type: integer
          description: 200 成功 / 500 业务失败 / 401 未登录 / 400 参数错误 / 405 方法不支持
          example: 200
        message:
          type: string
          example: success
        data:
          nullable: true
          description: 业务数据，无数据时为 null

    ResultEmp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Emp'

    ResultLoginUser:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginUser'

    ResultPageEmp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PageEmp'

    PageEmp:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/Emp'
        total: { type: integer, format: int64, example: 12 }
        size: { type: integer, example: 5 }
        current: { type: integer, example: 1 }
        pages: { type: integer, format: int64, example: 3 }

    Emp:
      type: object
      description: 员工实体。金额保留两位小数，日期为 yyyy-MM-dd，`deleted` 不对外暴露。
      properties:
        empId: { type: integer, example: 1 }
        empName: { type: string, maxLength: 50, example: 张伟 }
        gender: { type: string, enum: [男, 女], example: 男 }
        dept: { type: string, maxLength: 50, example: 研发部 }
        post: { type: string, maxLength: 50, nullable: true, example: 后端工程师 }
        salary: { type: number, format: bigdecimal, example: 18500.00 }
        hireDate: { type: string, format: date, example: '2021-03-15' }
        status:
          type: integer
          enum: [0, 1]
          description: 1 在职 / 0 离职
          example: 1
        createTime: { type: string, format: date-time, example: '2021-03-15 09:00:00' }
        updateTime: { type: string, format: date-time, example: '2021-03-15 09:00:00' }

    EmpInput:
      type: object
      description: 新增/修改请求体。修改时必须带 `empId`。
      required: [empName, gender, dept, salary, hireDate, status]
      properties:
        empId:
          type: integer
          description: 仅修改时需要
          example: 13
        empName: { type: string, maxLength: 50, example: 张伟 }
        gender: { type: string, enum: [男, 女], example: 男 }
        dept: { type: string, maxLength: 50, example: 研发部 }
        post: { type: string, maxLength: 50, example: 后端工程师 }
        salary: { type: number, minimum: 0, example: 18500.00 }
        hireDate: { type: string, format: date, example: '2021-03-15' }
        status: { type: integer, enum: [0, 1], example: 1 }

    Dept:
      type: object
      description: 部门。与 emp 靠 deptName 关联，无外键。
      properties:
        deptId: { type: integer, example: 1 }
        deptName: { type: string, maxLength: 50, example: 研发部 }
        location: { type: string, maxLength: 50, example: A 座 3 层 }
        status:
          type: integer
          enum: [0, 1]
          description: 1 启用 / 0 停用
          example: 1
        createTime: { type: string, format: date-time, example: '2026-01-01 00:00:00' }
        updateTime: { type: string, format: date-time, example: '2026-01-01 00:00:00' }

    DeptInput:
      type: object
      description: 新增/修改请求体。修改时必须带 deptId。
      required: [deptName, status]
      properties:
        deptId:
          type: integer
          description: 仅修改时需要
          example: 1
        deptName: { type: string, maxLength: 50, example: 研发部 }
        location: { type: string, maxLength: 50, example: A 座 3 层 }
        status: { type: integer, enum: [0, 1], example: 1 }

    Attendance:
      type: object
      description: 考勤记录。status 由服务端按打卡时间推导，非入参。
      properties:
        attId: { type: integer, example: 1 }
        empId: { type: integer, example: 1 }
        empName:
          type: string
          description: 服务端批量回填；员工已删时为「已删除员工」
          example: 张伟
        workDate: { type: string, format: date, example: '2026-11-02' }
        checkIn: { type: string, example: '09:00:00', nullable: true }
        checkOut: { type: string, example: '18:00:00', nullable: true }
        status:
          type: integer
          description: 0 正常 / 1 迟到 / 2 早退 / 3 缺勤
          enum: [0, 1, 2, 3]
        remark: { type: string, nullable: true }

    AttendanceInput:
      type: object
      required: [empId, workDate]
      description: |
        打卡时间必须同时填写或同时留空；留空表示缺勤。
        status 不用传，传了也会被服务端推导结果覆盖。
      properties:
        empId: { type: integer, example: 7 }
        workDate: { type: string, format: date, example: '2026-11-05' }
        checkIn:
          type: string
          description: HH:mm 或 HH:mm:ss
          example: '09:00:00'
          nullable: true
        checkOut:
          type: string
          example: '18:00:00'
          nullable: true
        remark: { type: string, maxLength: 100, nullable: true }

    AttendanceSummary:
      type: object
      description: 月度汇总的查询模型，不是表映射
      properties:
        empId: { type: integer, example: 1 }
        empName: { type: string, example: 张伟 }
        totalDays: { type: integer, description: 该月有记录的天数（含缺勤）, example: 2 }
        normalDays: { type: integer, example: 2 }
        lateDays: { type: integer, example: 0 }
        earlyDays: { type: integer, example: 0 }
        absentDays: { type: integer, example: 0 }
        attendanceRate:
          type: number
          format: double
          description: (总天数 − 缺勤) / 总天数 × 100，保留两位
          example: 100.0

    SalaryRecord:
      type: object
      description: 薪资记录。total 由服务端计算，入参忽略。
      properties:
        id: { type: integer, example: 8 }
        empId: { type: integer, example: 1 }
        empName: { type: string, example: 张伟 }
        month: { type: string, example: '2026-11' }
        base: { type: number, example: 18500.00 }
        bonus: { type: number, example: 0.00 }
        deduction:
          type: number
          description: 生成/重算时按考勤计算，也可人工调整
          example: 850.57
        total: { type: number, example: 17649.43 }
        status:
          type: integer
          description: 0 待发放 / 1 已发放
          enum: [0, 1]
        createTime: { type: string, example: '2026-11-24 16:55:00' }
        updateTime: { type: string, example: '2026-11-24 16:55:00' }

    SalaryUpdate:
      type: object
      required: [id, empId, month, base, bonus, deduction]
      description: empId 与 month 仅作占位，修改不生效
      properties:
        id: { type: integer, example: 8 }
        empId: { type: integer, example: 1 }
        month: { type: string, example: '2026-11' }
        base: { type: number, minimum: 0, example: 18500.00 }
        bonus: { type: number, minimum: 0, example: 1200.00 }
        deduction: { type: number, minimum: 0, example: 200.00 }

    SalaryGenerateResult:
      type: object
      description: generate 与 recalculate 共用；generated 分别表示新生成/重算条数
      properties:
        month: { type: string, example: '2026-11' }
        generated: { type: integer, example: 10 }
        skipped: { type: integer, description: 已存在或已发放而跳过, example: 0 }
        deductedTotal: { type: number, description: 本次涉及的考勤扣款合计, example: 1025.52 }

    User:
      type: object
      description: 账号。响应中不含 passwordHash（@JsonIgnore）。
      properties:
        userId: { type: integer, example: 1 }
        username: { type: string, example: admin }
        displayName: { type: string, example: 系统管理员 }
        status: { type: integer, enum: [0, 1], example: 1 }
        createTime: { type: string, example: '2026-01-01 00:00:00' }

    UserCreate:
      type: object
      required: [username, password, displayName, status]
      properties:
        username: { type: string, maxLength: 50, example: qa01 }
        password: { type: string, minLength: 6, maxLength: 32, example: qa123456 }
        displayName: { type: string, maxLength: 50, example: 验收员 }
        status: { type: integer, enum: [0, 1], example: 1 }

    UserUpdate:
      type: object
      required: [userId, displayName, status]
      description: 用户名不可改；不能停用当前登录账号
      properties:
        userId: { type: integer, example: 2 }
        displayName: { type: string, maxLength: 50, example: 张三丰 }
        status: { type: integer, enum: [0, 1], example: 1 }

    PasswordReset:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, minLength: 6, maxLength: 32, example: newpass1 }

    OpLog:
      type: object
      description: 操作审计。只记写操作，失败也落库；校验失败不记录。
      properties:
        logId: { type: integer, format: int64, example: 12 }
        operator: { type: string, description: 取不到登录态时为 anonymous, example: admin }
        action: { type: string, description: HTTP 方法, example: DELETE }
        target: { type: string, description: 请求路径，含路径变量, example: /users/1 }
        detail: { type: string, description: 成功记 success，失败记业务异常原文, example: 不能删除当前登录的账号 }
        result: { type: integer, enum: [0, 1], description: 1 成功 / 0 失败, example: 0 }
        createTime: { type: string, example: '2026-11-24 16:35:08' }

    LoginDTO:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, format: password, example: '123456' }

    LoginUser:
      type: object
      description: 登录态载体，不含口令摘要等敏感字段
      properties:
        userId: { type: integer, example: 1 }
        username: { type: string, example: admin }
        displayName: { type: string, example: 系统管理员 }
