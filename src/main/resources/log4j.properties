# ============================================================================
# 日志配置（reload4j，包名与 API 与 log4j 1.2 完全兼容）
#
# 为什么要开 Mapper 包的 DEBUG：
#   MyBatis 在 DEBUG 级别下才会打印 Preparing / Parameters，
#   排查「参数绑定错位」「结果映射为空」这两类问题全靠这两行。
#   并发压测时 SQL 会刷屏，可临时把最后一行注释掉。
# ============================================================================

log4j.rootLogger=INFO, CONSOLE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.Target=System.out
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{HH:mm:ss.SSS} [%-5p] %c{1} - %m%n

# MyBatis-Plus 在启动阶段会打印装配信息，非 DEBUG 不显示，保持默认即可
log4j.logger.com.lab.emp.mapper=DEBUG
