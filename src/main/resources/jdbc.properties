# ============================================================================
# 数据库连接配置
#
# 这里的值对应本地开发环境（Docker 容器 dev-mysql）。
# password 仅为本地默认值，真实环境请改用环境变量 EMP_DB_PASSWORD 覆盖，
# 由 SpringConfig 在装配 Druid 数据源时优先读取环境变量 —— 不要把真实口令提交进仓库。
# ============================================================================

jdbc.driver=com.mysql.cj.jdbc.Driver

# serverTimezone 显式声明为东八区，与容器 --default-time-zone=+08:00 保持一致；
# allowPublicKeyRetrieval 是 MySQL 8 默认 caching_sha2_password 插件所必需。
jdbc.url=jdbc:mysql://127.0.0.1:3306/ssm_emp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

jdbc.username=root
jdbc.password=123456

# Druid 连接池参数
jdbc.initialSize=5
jdbc.maxActive=20
jdbc.minIdle=5
jdbc.maxWait=3000
