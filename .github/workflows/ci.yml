name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: ssm_emp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 显式指定 utf8mb4：mysql 客户端默认按 latin1 解释输入流，
      # 否则种子数据里的中文会被二次编码成乱码，后续断言全部失败。
      - name: 初始化数据库
        run: |
          mysql --version
          mysql -h 127.0.0.1 -P 3306 -uroot -p123456 \
                --default-character-set=utf8mb4 < sql/init.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -p123456 -N \
                -e "select count(*) from ssm_emp.emp; select count(*) from ssm_emp.sys_user;"

      - name: 编译、测试并打包
        run: mvn -B -ntp clean verify

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: war
          path: target/*.war
          retention-days: 7
